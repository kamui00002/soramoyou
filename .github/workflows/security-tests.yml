# ☀️ セキュリティテスト：PR ごとに functions の単体テストと、demo- の Emulator テストを回す。
# - 本番に触れない：demo- の ID（package.json の test:emulator）と Emulator だけを使う。
# - secrets は一切参照しない。Rules Test API の Python テストはトークンが要るので入れない。
# - 自動デプロイ・自動マージはしない。
name: security-tests

on:
  pull_request:
    branches: [main]   # main 向けの PR だけ。paths の絞り込みは付けない（必須チェックにすると、該当しない PR が永遠に「待ち」になるため）

# GITHUB_TOKEN（Actions が自動で配る鍵）は読むだけ
permissions:
  contents: read

# 同じ PR に新しい push が来たら、古い実行は止める
concurrency:
  group: security-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-tests:          # ← この名前が「必須チェック」の名前になる
    runs-on: ubuntu-latest
    timeout-minutes: 20    # 手元では Emulator テストが約 4 分半。固まったときの上限
    defaults:
      run:
        working-directory: functions
    steps:
      # Action はタグでなくコミットの番号（SHA）で固定する（タグの付け替えで中身がすり替わらないように）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
        with:
          persist-credentials: false        # 鍵を .git/config に残さない
      - name: UI テストの起動の見張り（Emulator への目印を通らない書き方を探す・grep だけ）
        working-directory: .
        run: bash scripts/check-uitests-launch-guard.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1（Emulator は Java 21 以上が要る）
        with:
          distribution: temurin
          java-version: "21"
      - name: firebase-tools（手元で試した版に固定）
        run: npm install -g firebase-tools@15.0.0 --ignore-scripts --no-audit --no-fund
      - name: 依存を入れる（入れるときに動くスクリプトは止める）
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 単体テスト
        run: npm test
      - name: Emulator テスト（demo- の ID）
        run: npm run test:emulator
