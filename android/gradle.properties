# ⭐️ ビルド全体の Gradle の設定
# Gradle を動かす JVM のメモリ（Android のビルドは既定値だと足りない）
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# AndroidX のライブラリを使う
android.useAndroidX=true
# Kotlin の公式のコードスタイル
kotlin.code.style=official
# 書き込みの可否を決めるマイルストーン（M1〜M6）。:app のビルドが BuildConfig.WRITE_MILESTONE に焼き込み、
# WriteGate はこの値だけから有効な書き込みの集合を決める（タスク 6.1・設計書「マイルストーンと有効化の範囲」）。
# M1 は書き込みの集合が空（本番への書き込みゼロ）。値を上げるのは、そのマイルストーンで最初に書き込みが要るタスクだけ。
soramoyou.milestone=M6
# 検証用の変種（emulator。demo- のプロジェクトのエミュレータにだけ繋ぐ）のマイルストーン。soramoyou.milestone 以上にする。
# 本番より先に書き込みを試すために別に持つ（タスク 14・2026-10-05 ユーザー判断：検証用だけ M2、本番用は M1。2026-10-09 に本番用も M2 にした。同日、タスク 18.2 で両方を M3 に、タスク 21.1 で両方を M4 にした。タスク 29.1 で両方を M5 にした。タスク 34.1 で両方を M6 にした（書き込みの集合は M5 と同じ））
soramoyou.emulatorMilestone=M6
# 広告（タスク 32.1・要件 14.2・14.3）。リリースビルドがどちらの広告を出すか：
#   CLOSED_TEST      … Google のテスト用のアプリ ID と広告ユニット（クローズドテストのビルド。テスターが押しても無効なトラフィックにならない）
#   PRODUCTION_TRACK … 下の本番の ID（本番トラック用のビルドでだけ使う。タスク 39）
# debug ビルドと検証用の変種（emulator）は、この値に関係なく Google のテスト用の ID を使う。app/build.gradle.kts が BuildConfig と
# マニフェストに焼き込み、上の 2 つ以外の値ではビルドを止める。
soramoyou.adsTrack=CLOSED_TEST
# Android 用に新規発行した本番の AdMob のアプリ ID とバナーの広告ユニット ID（タスク 27 のユーザー作業で作ってから入れる。iOS 版の ID は使わない）。
# クライアントに埋め込む前提の公開値なので、リポジトリに置く（設計書「公開キー」）。空のまま adsTrack を PRODUCTION_TRACK にすると、ビルドを止める。
soramoyou.admobProductionAppId=ca-app-pub-5237930968754753~6233049978
soramoyou.admobProductionBannerUnitId=ca-app-pub-5237930968754753/6352469474
