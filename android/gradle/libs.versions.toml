# ⭐️ 版数の一元管理（バージョンカタログ）
# 版数はここにだけ書き、各モジュールの build.gradle.kts からは別名（libs.xxx）で参照する。
# 版数は `+` を使わず固定する。各版数は Google Maven / Maven Central の maven-metadata.xml で
# 実在を確かめた、2026-10-02 時点の最新の安定版（alpha・beta・rc を除く）である（タスク 1.2）。

[versions]
# AGP 9.4 は Gradle 9.6.0 以上・JDK 17 以上が必要（公式リリースノートで 2026-10-01 に確認）。
# 設計書の 9.4.0 / 9.6.0 と同じ組み合わせの、不具合修正だけの版（9.4.1 / 9.6.1）を使う。
# AGP 9.4 が扱える API レベルの上限は 37（公式リリースノートで 2026-10-02 に確認）。
agp = "9.4.1"
# AGP 9.4 が同梱する Kotlin は 2.2.10。ライブラリが新しい Kotlin でコンパイルされていても
# 読めるように、2026-10-01 時点の最新の安定版に上げる（Gradle 9.6 は対応範囲 7.6.3〜9.7.0 に入る）。
# Compose コンパイラと kotlinx-serialization のプラグインも、この版にそろえる。
kotlin = "2.4.20"

# Firebase の各ライブラリの版は BoM で一括して決める（設計書で指定済み）。
# KTX モジュールは BoM 34.0.0 で廃止済みなので使わない。
firebaseBom = "34.19.0"
# Firebase の Gradle プラグイン（google-services.json の読み込み・Crashlytics のビルド ID とマッピングファイル）。
# 版数は Crashlytics の公式の導入手順（2026-10-02 取得）に書かれている版と同じ。
googleServices = "4.5.0"
firebaseCrashlyticsGradle = "3.0.8"

# Compose の各ライブラリの版は BOM で一括して決める（設計書で指定済み。ui 1.12.1・material3 1.4.0）。
# ⚠️ Compose 1.12 は compileSdk 37 以上が必要（:app の compileSdk の注記を参照）。
composeBom = "2026.09.00"
# Compose の BOM に入っていない AndroidX のライブラリ
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# 型安全なルート（@Serializable のクラスでルートを表す）を使う
navigation = "2.10.2"

# 型安全なルートの @Serializable の注釈と、ルートの直列化（タスク 8.3・2026-10-05 にユーザーが追加を承認）。
# Navigation 2.10.2 は kotlinx-serialization-core を実行時の依存（androidRuntimeElements・1.7.3 以上）にしか載せておらず、
# コンパイル時には見えないため、直接の依存として足す。1.11.0 は Maven Central の maven-metadata.xml で
# 2026-10-05 時点の最新の安定版（1.12.0-RC は除く）で、.module が要求する kotlin-stdlib は 2.3.20（Kotlin 2.4.20 で読める）。
kotlinxSerialization = "1.11.0"

# 画像の表示（Coil 3）。Coil 3 は既定ではネットワークの画像を読めないため、OkHttp の部品も同じ版で入れる
coil = "3.6.3"
# PostHog（iOS 版と同じプロジェクトへ送る）
posthog = "3.71.4"
# 写真の EXIF の向きを読む（タスク 16.1・2026-10-07 にユーザーが追加を承認。設計書の exifinterface〔P1〕）。
# OS 標準の android.media.ExifInterface ではなく、OS の版ごとの不具合が直された androidx の版を使う。
# 1.4.2 は Google Maven の maven-metadata.xml で 2026-10-07 時点の最新の安定版（latest・release とも 1.4.2）
exifinterface = "1.4.2"

# JVM の単体テスト（:contract・:app 共通）。Maven Central の maven-metadata.xml で 2026-10-02 に実在を確認した。
# JUnit 4 を使う理由：設計書は「JUnit」とだけ書いており、AGP の :app の単体テストが既定で使うのも JUnit 4 のため、
# 2 つのモジュールで同じ枠組みにそろえられる（JUnit 5 は :app 側に追加の設定が要る）。
# 4.13.2 は JUnit 4 の最終版（2021-02 から更新なし）で、Gradle 9.6 でも追加のランチャー設定なしに動く。
junit = "4.13.2"
# 端末で動かす結合テスト（タスク 11.1・2026-10-05 にユーザーが追加を承認）。Google Maven の maven-metadata.xml で
# 2026-10-05 に確認した最新の安定版（alpha・beta・rc を除く）
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# 広告（タスク 32.1・設計書の技術スタック「GMA Next-Gen SDK 1.5.0 と UMP SDK」）。Google Maven の maven-metadata.xml で
# 2026-10-13 に確認した最新の安定版（ads-mobile-sdk は latest・release とも 1.5.0、user-messaging-platform は 4.0.0）。
# 1.5.0 の POM は UMP 4.0.0 を compile の依存に持つ。同意の取得のコードが UMP を直接使うので、同じ版を明示して入れる
# （Next-Gen を上げたときに UMP の版が黙って変わらないように）。Next-Gen は minSdk 24・compileSdk 35 以上、UMP 4.0.0 は minSdk 23
adsMobileSdk = "1.5.0"
userMessagingPlatform = "4.0.0"

[libraries]
# Firebase（版数は BoM が決める。firebase-messaging は入れない：要件 2.10）
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Compose（版数は BOM が決める）
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# 画面のテスト（端末で動かす。タスク 9.5・2026-11-10 にユーザーが追加を承認）。createComposeRule の規則と、
# その規則が画面を載せる空の Activity を足す manifest（公式 developer.android.com/develop/ui/compose/testing の Setup）
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Compose と組み合わせる AndroidX のライブラリ
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# 型安全なルート（Navigation Compose）の注釈と直列化
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# 画像の表示
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 写真の EXIF の向き
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# 分析
posthog-android = { group = "com.posthog", name = "posthog-android", version.ref = "posthog" }

# 広告（GMA Next-Gen）と同意の取得（UMP）
ads-mobile-sdk = { group = "com.google.android.libraries.ads.mobile.sdk", name = "ads-mobile-sdk", version.ref = "adsMobileSdk" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }

# JVM の単体テスト。kotlin-test は Kotlin 本体と同じ版にそろえる（kotlin = 2.4.20。2.4.21 は RC のため使わない）。
# Gradle が JUnit 4 用の kotlin-test-junit を自動で選ぶ。
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# :app 用。AGP の組み込み Kotlin は、:contract の Kotlin（JVM）のプラグインのように JUnit 4 用の部品を自動で選ばない。
# kotlin.test.Test（JUnit 4 の @Test の別名）はこの部品にあるので、:app では明示して入れる（2026-10-03 に未解決で落ちることを確認）
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Kotlin 2.0 以降の Compose コンパイラ（版数は Kotlin と同じ）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# 型安全なルートの @Serializable に必要。:app に適用している（タスク 8.3）
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }
